<title>منصة العلوم ثلاثية الأبعاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: night-lab bench. Home is a single column of unit "reagent shelves";
   the game is a full-screen WebGL bench with a definitions tray (top on phones, side on wide screens).
   Deliberately one dark look, so every colour is set explicitly. */
:root {
  --bg: #0e1c2b;        /* lab at night, blue-slate */
  --bench: #15283b;     /* panels */
  --line: #2a4560;      /* hairlines, disabled */
  --fg: #eef3f7;
  --muted: #9cb1c5;
  --brass: #f2aa3c;     /* accent: brass fittings, stars */
  --ok: #4fd18b;
  --bad: #ff6b5e;
  --pad-1: #ff8a5c;     /* platform أ */
  --pad-2: #38c6b6;     /* platform ب */
  --pad-3: #6fa8ff;     /* platform ج */
  --pad-4: #e6c94a;     /* platform د */
  --display: "Lalezar", "Tajawal", system-ui, sans-serif;
  --body: "Tajawal", system-ui, "Segoe UI", Tahoma, sans-serif;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.75rem;
  --step-3: clamp(2.1rem, 7vw, 3.2rem);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: var(--step-0);
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
#app { min-height: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

/* ---------- Home ---------- */
.home {
  max-width: 46rem;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 28px 48px;
  display: grid;
  gap: 28px;
}
.masthead { display: grid; gap: 10px; }
.eyebrow { margin: 0; color: var(--brass); font-weight: 700; letter-spacing: 0.02em; font-size: var(--step--1); }
.masthead h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: var(--step-3);
  line-height: 1.15;
  text-wrap: balance;
}
.masthead h1 span { color: var(--brass); }
.lede { margin: 0; color: var(--muted); max-width: 36rem; }
.totals { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted);
  font-size: var(--step--1); font-variant-numeric: tabular-nums;
}
.chip b { color: var(--fg); }

.units { display: grid; gap: 18px; }
.unit {
  background: var(--bench);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  display: grid;
  gap: 14px;
}
.unit-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.unit-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: var(--step-2); line-height: 1.2; }
.unit-num { color: var(--brass); font-size: var(--step--1); font-weight: 700; }
.unit-en { color: var(--muted); font-size: var(--step--1); direction: ltr; }
.status { font-size: 0.75rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.status.reviewed { border-color: var(--ok); color: var(--ok); }

.term-strip { display: flex; flex-wrap: wrap; gap: 6px; direction: ltr; justify-content: flex-end; }
.term-strip span {
  font-size: 0.75rem; padding: 2px 8px; border-radius: 6px;
  background: var(--bg); color: var(--muted);
}

.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 10px; }
.game-card {
  text-align: right;
  display: grid; gap: 4px; align-content: start;
  padding: 14px; border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  cursor: pointer;
  min-width: 0;
}
.game-card:hover:not(:disabled) { border-color: var(--brass); }
.game-card:disabled { cursor: default; opacity: 0.55; }
.game-card strong { font-size: var(--step-1); font-weight: 800; }
.game-card p { margin: 0; color: var(--muted); font-size: var(--step--1); line-height: 1.5; }
.game-card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: var(--step--1); }
.stars { color: var(--brass); letter-spacing: 2px; font-size: 1rem; }
.stars .off { color: var(--line); }
.soon { color: var(--muted); }
.unit.placeholder { background: transparent; border-style: dashed; color: var(--muted); }
.unit.placeholder h2 { color: var(--muted); }
.unit.placeholder p { margin: 0; font-size: var(--step--1); }

/* ---------- Game ---------- */
.game { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud {
  position: absolute; inset-inline: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(var(--bg), transparent);
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px; flex: none;
  border: 1px solid var(--line); background: var(--bench); cursor: pointer; font-size: 1.2rem;
}
.hud-title { display: grid; line-height: 1.25; min-width: 0; flex: 1; }
.hud-title strong { font-family: var(--display); font-weight: 400; font-size: var(--step-1); }
.hud-title span { color: var(--muted); font-size: var(--step--1); }
.hud-score { display: grid; justify-items: center; line-height: 1; font-variant-numeric: tabular-nums; }
.hud-score span { font-size: var(--step-2); font-weight: 800; color: var(--brass); }
.hud-score small { color: var(--muted); font-size: 0.7rem; }

/* definitions tray: the Arabic side of the match */
.tray {
  position: absolute; inset-inline: 10px; top: calc(env(safe-area-inset-top, 0px) + 64px);
  display: grid; gap: 6px;
  pointer-events: none;
}
.def {
  pointer-events: auto;
  display: grid; grid-template-columns: 2rem 1fr; gap: 10px; align-items: center;
  padding: 8px 10px; border-radius: 10px;
  background: color-mix(in srgb, var(--bench) 88%, transparent);
  border: 1px solid var(--line);
  border-inline-start: 4px solid var(--c);
  font-size: 0.9rem; line-height: 1.5;
  text-align: right; cursor: pointer;
  transition: border-color .2s, background .2s;
}
.def .tag {
  width: 2rem; height: 2rem; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--c); color: var(--bg); font-weight: 800; font-size: 1rem;
}
.def .txt { min-width: 0; }
.def .ans { display: block; color: var(--ok); font-weight: 700; font-size: var(--step--1); }
.def.done { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--bench)); cursor: default; }
.def.target { border-color: var(--brass); }
.def.decoy { opacity: 0.6; cursor: default; }
.def.decoy .ans { color: var(--muted); }
.def.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.hint {
  position: absolute; inset-inline: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  text-align: center; color: var(--muted); font-size: var(--step--1);
  padding-inline: 16px; pointer-events: none;
}

.toast {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 48px);
  transform: translate(-50%, 20px); opacity: 0;
  padding: 8px 16px; border-radius: 999px;
  background: var(--bench); border: 1px solid var(--line);
  font-weight: 700; white-space: nowrap; pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.ok { border-color: var(--ok); color: var(--ok); }
.toast.bad { border-color: var(--bad); color: var(--bad); }

/* level result sheet */
.sheet-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 70%, transparent); }
.sheet {
  width: min(26rem, 100%);
  background: var(--bench); border: 1px solid var(--line); border-radius: 16px;
  padding: 22px; display: grid; gap: 14px; text-align: center;
}
.sheet h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: var(--step-2); }
.sheet .big-stars { font-size: 2.4rem; letter-spacing: 6px; color: var(--brass); }
.sheet .big-stars .off { color: var(--line); }
.sheet p { margin: 0; color: var(--muted); }
.learned { display: grid; gap: 6px; text-align: right; }
.learned div { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; padding: 6px 10px; border-radius: 8px; background: var(--bg); font-size: 0.9rem; }
.learned small { flex-basis: 100%; color: var(--muted); font-size: var(--step--1); line-height: 1.5; }
.learned bdi { direction: ltr; color: var(--brass); font-weight: 700; }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 800;
  border: 1px solid var(--line); background: var(--bg);
}
.btn.primary { background: var(--brass); color: var(--bg); border-color: var(--brass); }

@media (min-width: 820px) and (orientation: landscape) {
  .tray { inset-inline: 16px auto; width: 22rem; }
  .def { font-size: 0.95rem; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .def { transition: none; }
  .def.shake { animation: none; }
}

</style>

<div id="app" dir="rtl" lang="ar">
  <!-- Home: one card per unit (from content/terms), each listing that unit's games -->
  <main id="home" class="home">
    <header class="masthead">
      <p class="eyebrow">الأول المتوسط · المتميزين</p>
      <h1>منصة العلوم <span>ثلاثية الأبعاد</span></h1>
      <p class="lede">ألعاب قصيرة تثبّت مصطلحات العلوم بالإنكليزية والعربية. اختر فصلاً، ثم لعبة.</p>
      <div class="totals" id="totals"></div>
    </header>
    <section class="units" id="units" aria-label="الفصول"></section>
  </main>

  <!-- Game screen: WebGL canvas + HUD; each game fills #stage-ui -->
  <section id="game" class="game" hidden>
    <canvas id="scene" aria-label="مختبر ثلاثي الأبعاد"></canvas>
    <div class="hud">
      <button class="icon-btn" id="btn-back" type="button" aria-label="رجوع إلى الصفحة الرئيسية">→</button>
      <div class="hud-title">
        <strong id="hud-game">مختبر المصطلحات</strong>
        <span id="hud-level">المستوى ١ من ٤</span>
      </div>
      <div class="hud-score"><span id="hud-score">0</span><small>نقطة</small></div>
    </div>
    <div id="stage-ui"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </section>
</div>

<script>
// مختبر المصطلحات — drag (or tap) an English-term cube onto the platform of its Arabic definition.
// One level = 3 terms (4 when the unit's count leaves a remainder). Reads terms only from the unit data.
const TermLab = (() => {
  const LETTERS = ["أ", "ب", "ج", "د"];
  const PAD_COLORS = ["#ff8a5c", "#38c6b6", "#6fa8ff", "#e6c94a"];
  const INK = "#0e1c2b";
  const IVORY = "#f3ead8";
  const BRASS = new THREE.Color("#f2aa3c");
  const CUBE_Y = 0.65;

  let ctx = null; // {renderer, scene, camera, ...} built once, reused across levels
  let run = null; // current level state

  function levelsOf(terms) {
    const out = [];
    for (let i = 0; i < terms.length; i += 3) out.push(terms.slice(i, i + 3));
    if (out.length > 1 && out[out.length - 1].length === 1) out[out.length - 2].push(out.pop()[0]);
    return out;
  }

  function shuffle(a) {
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [b[i], b[j]] = [b[j], b[i]];
    }
    return b;
  }

  // ---------- textures ----------
  function wrapLines(g, text, maxW) {
    const words = text.split(" ");
    const lines = [];
    let line = "";
    for (const w of words) {
      const t = line ? line + " " + w : w;
      if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
    }
    lines.push(line);
    return lines;
  }

  function termTexture(text) {
    const c = document.createElement("canvas");
    c.width = c.height = 256;
    const g = c.getContext("2d");
    g.fillStyle = IVORY;
    g.fillRect(0, 0, 256, 256);
    g.strokeStyle = "rgba(14,28,43,.18)";
    g.lineWidth = 10;
    g.strokeRect(5, 5, 246, 246);
    g.fillStyle = INK;
    g.textAlign = "center";
    g.textBaseline = "middle";
    let size = 64, lines;
    do {
      g.font = `800 ${size}px Tajawal, system-ui, sans-serif`;
      lines = wrapLines(g, text, 216);
      size -= 4;
    } while ((lines.some((l) => g.measureText(l).width > 216) || lines.length * size * 1.15 > 200) && size > 26);
    const lh = (size + 4) * 1.1;
    lines.forEach((l, i) => g.fillText(l, 128, 128 + (i - (lines.length - 1) / 2) * lh));
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }

  function padTexture(letter, color) {
    const c = document.createElement("canvas");
    c.width = c.height = 256;
    const g = c.getContext("2d");
    g.fillStyle = color;
    g.beginPath(); g.arc(128, 128, 128, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "rgba(255,255,255,.55)";
    g.lineWidth = 8;
    g.beginPath(); g.arc(128, 128, 104, 0, Math.PI * 2); g.stroke();
    g.fillStyle = INK;
    g.font = "120px Lalezar, Tajawal, sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.direction = "rtl";
    g.fillText(letter, 128, 140);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  function benchTexture() {
    const c = document.createElement("canvas");
    c.width = c.height = 512;
    const g = c.getContext("2d");
    g.fillStyle = "#15283b";
    g.fillRect(0, 0, 512, 512);
    g.strokeStyle = "#1f3852";
    g.lineWidth = 4;
    for (let i = 0; i <= 512; i += 128) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 512); g.stroke();
      g.beginPath(); g.moveTo(0, i); g.lineTo(512, i); g.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(6, 6);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  // ---------- scene ----------
  function build(canvas) {
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "low-power" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor("#0e1c2b");

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog("#0e1c2b", 14, 26);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 60);

    scene.add(new THREE.HemisphereLight("#dfe9f3", "#0e1c2b", 1.4));
    const sun = new THREE.DirectionalLight("#fff3e0", 1.6);
    sun.position.set(-3, 8, 5);
    scene.add(sun);

    const bench = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({ map: benchTexture(), roughness: 0.9 })
    );
    bench.rotation.x = -Math.PI / 2;
    scene.add(bench);

    // a few glass flasks at the back of the bench, purely for atmosphere
    const glass = new THREE.MeshStandardMaterial({ color: "#9fd8ff", transparent: true, opacity: 0.35, roughness: 0.1 });
    const liquid = [
      new THREE.MeshStandardMaterial({ color: "#38c6b6", emissive: "#0b3b36", roughness: 0.4 }),
      new THREE.MeshStandardMaterial({ color: "#ff8a5c", emissive: "#3b1606", roughness: 0.4 }),
      new THREE.MeshStandardMaterial({ color: "#6fa8ff", emissive: "#0c2246", roughness: 0.4 }),
    ];
    [[-5.2, -5.5, 0], [-3.9, -6.2, 1], [4.6, -5.8, 2], [5.8, -4.6, 0]].forEach(([x, z, k], i) => {
      const flask = new THREE.Group();
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.7, 20, 14), glass);
      body.position.y = 0.7;
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.9, 14, 1, true), glass);
      neck.position.y = 1.7;
      const fill = new THREE.Mesh(new THREE.SphereGeometry(0.55, 18, 12, 0, Math.PI * 2, Math.PI * 0.45, Math.PI * 0.55), liquid[k]);
      fill.position.y = 0.7;
      flask.add(fill, body, neck);
      flask.position.set(x, 0, z);
      flask.scale.setScalar(i % 2 ? 0.8 : 1);
      scene.add(flask);
    });

    const shadowTex = (() => {
      const c = document.createElement("canvas");
      c.width = c.height = 64;
      const g = c.getContext("2d");
      const gr = g.createRadialGradient(32, 32, 2, 32, 32, 32);
      gr.addColorStop(0, "rgba(0,0,0,.55)");
      gr.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = gr;
      g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    })();

    const levelGroup = new THREE.Group();
    scene.add(levelGroup);

    ctx = {
      renderer, scene, camera, levelGroup, shadowTex,
      raycaster: new THREE.Raycaster(),
      dragPlane: new THREE.Plane(new THREE.Vector3(0, 1, 0), -CUBE_Y - 0.6),
      pointer: new THREE.Vector2(),
      tweens: [],
      clock: new THREE.Clock(),
      raf: 0,
    };
    bindPointer(canvas);
    window.addEventListener("resize", resize);
  }

  // Fit the bench (pads + cubes) into the part of the screen the definitions tray leaves free:
  // binary-search the camera distance on the projected bounding box, then shift with a view offset.
  function resize() {
    if (!ctx) return;
    const { renderer, camera } = ctx;
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    const tray = document.querySelector(".tray");
    const r = tray ? tray.getBoundingClientRect() : null;
    const free = { l: 8, r: w - 8, t: 64, b: h - 44 };
    if (r && r.width < w * 0.7) free.r = r.left - 12; // tray on the side
    else if (r) free.t = r.bottom + 8;                // tray on top
    const L = run ? run.layout : { half: 3.8, back: -3, front: 2.4, tall: false };
    const box = [];
    for (const x of [-L.half, L.half]) for (const z of [L.back, L.front]) for (const y of [0, 1.4]) box.push(new THREE.Vector3(x, y, z));
    const [cy, cz] = L.tall ? [0.88, 0.48] : [0.8, 0.6];
    camera.aspect = w / h;
    camera.clearViewOffset();
    const v = new THREE.Vector3();
    const project = (d) => {
      camera.position.set(0, d * cy, d * cz);
      camera.lookAt(0, 0, 0.2);
      camera.updateMatrixWorld();
      camera.updateProjectionMatrix();
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const p of box) {
        v.copy(p).project(camera);
        const sx = (v.x + 1) / 2 * w, sy = (1 - v.y) / 2 * h;
        x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
      }
      return { x0, x1, y0, y1 };
    };
    let lo = 4, hi = 60;
    for (let i = 0; i < 24; i++) {
      const mid = (lo + hi) / 2, bb = project(mid);
      if (bb.x1 - bb.x0 <= free.r - free.l && bb.y1 - bb.y0 <= free.b - free.t) hi = mid; else lo = mid;
    }
    const bb = project(hi);
    ctx.scene.fog.near = hi * 1.1;
    ctx.scene.fog.far = hi * 2.4;
    const dx = (free.l + free.r) / 2 - (bb.x0 + bb.x1) / 2;
    const dy = (free.t + free.b) / 2 - (bb.y0 + bb.y1) / 2;
    camera.setViewOffset(w, h, -dx, -dy, w, h);
    camera.updateProjectionMatrix();
  }

  // ---------- level ----------
  function clearLevel() {
    const g = ctx.levelGroup;
    while (g.children.length) {
      const o = g.children.pop();
      o.traverse((m) => {
        if (m.geometry) m.geometry.dispose();
        if (m.material) [].concat(m.material).forEach((mat) => { if (mat.map && mat.map !== ctx.shadowTex) mat.map.dispose(); mat.dispose(); });
      });
    }
    ctx.tweens.length = 0;
  }

  function makeCube(term, size) {
    const tex = termTexture(term.en);
    const side = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.55 });
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), side);
    const shadow = new THREE.Mesh(
      new THREE.PlaneGeometry(size * 1.6, size * 1.6),
      new THREE.MeshBasicMaterial({ map: ctx.shadowTex, transparent: true, depthWrite: false })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.01;
    return { mesh, shadow, term };
  }

  function makePad(i, size) {
    const color = PAD_COLORS[i];
    const grp = new THREE.Group();
    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(size * 0.78, size * 0.86, 0.22, 36),
      new THREE.MeshStandardMaterial({ color, roughness: 0.5 })
    );
    base.position.y = 0.11;
    const top = new THREE.Mesh(
      new THREE.CircleGeometry(size * 0.72, 36),
      new THREE.MeshStandardMaterial({ map: padTexture(LETTERS[i], color), roughness: 0.6 })
    );
    top.rotation.x = -Math.PI / 2;
    top.position.y = 0.225;
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(size * 0.9, size * 1.02, 40),
      new THREE.MeshBasicMaterial({ color: "#f2aa3c", transparent: true, opacity: 0, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.02;
    grp.add(base, top, ring);
    return { group: grp, ring, base, top };
  }

  // One extra "decoy" definition per level (from the same unit, else from another unit),
  // so the last cube is never a forced match.
  function pickDecoy(unit, items, pool) {
    const taken = new Set(items.map((t) => t.id));
    const same = unit.terms.filter((t) => !taken.has(t.id));
    const other = pool.filter((t) => !taken.has(t.id));
    const from = same.length ? same : other;
    return from.length ? from[Math.floor(Math.random() * from.length)] : null;
  }

  function startLevel(unit, levelIndex, ui, onExit) {
    clearLevel();
    const levels = levelsOf(unit.terms);
    const items = levels[levelIndex];
    const n = items.length;
    const decoy = n < LETTERS.length ? pickDecoy(unit, items, ui.pool()) : null;
    const padTerms = shuffle(decoy ? items.concat(decoy) : items);
    const np = padTerms.length;
    // portrait phones get a narrower, deeper bench so the cubes stay large
    const tall = window.innerHeight > window.innerWidth;
    const size = np > 3 ? (tall ? 1.05 : 1.15) : 1.3;
    const gap = np > 3 ? (tall ? 1.45 : 2.15) : (tall ? 1.8 : 2.5);
    const padZ = tall ? -2.3 : -1.7, cubeZ = tall ? 2.0 : 1.5;
    const row = (k) => Array.from({ length: k }, (_, i) => (i - (k - 1) / 2) * gap);
    const padXs = row(np), xs = row(n);
    const layout = { half: ((np - 1) / 2) * gap + size * 0.75, back: padZ - size, front: cubeZ + size * 0.7, tall };

    run = {
      unit, levels, levelIndex, items, ui, onExit, layout, decoy,
      pads: [], cubes: [], selected: null, drag: null,
      mistakes: 0, matched: 0, score: 0,
    };

    // pads keep the tray order (أ ب ج د); the tray is RTL, so أ sits on the right of the bench too
    padTerms.forEach((term, i) => {
      const pad = makePad(i, Math.min(size, (gap * 0.46) / 0.86));
      pad.group.position.set(-padXs[i], 0, padZ);
      pad.term = term;
      pad.index = i;
      pad.base.userData.pad = pad;
      pad.top.userData.pad = pad;
      ctx.levelGroup.add(pad.group);
      run.pads.push(pad);
    });

    shuffle(items).forEach((term, i) => {
      const cube = makeCube(term, size);
      cube.home = new THREE.Vector3(xs[i], CUBE_Y, cubeZ);
      cube.mesh.position.copy(cube.home);
      cube.mesh.position.y = CUBE_Y + 3;
      cube.mesh.rotation.y = (Math.random() - 0.5) * 0.5;
      cube.phase = Math.random() * Math.PI * 2;
      cube.mesh.userData.cube = cube;
      cube.shadow.position.x = xs[i];
      cube.shadow.position.z = cubeZ;
      ctx.levelGroup.add(cube.mesh, cube.shadow);
      run.cubes.push(cube);
      tween(cube.mesh.position, { y: CUBE_Y }, 0.5 + i * 0.12);
    });

    ui.renderTray(padTerms, LETTERS, PAD_COLORS, (i) => tapPad(run.pads[i]));
    ui.setLevel(levelIndex, levels.length);
    ui.setScore(0);
    resize();
  }

  // ---------- interaction ----------
  function pick(e, objects) {
    const rect = ctx.renderer.domElement.getBoundingClientRect();
    ctx.pointer.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    ctx.raycaster.setFromCamera(ctx.pointer, ctx.camera);
    return ctx.raycaster.intersectObjects(objects, false)[0] || null;
  }

  function planePoint(e) {
    pick(e, []);
    const p = new THREE.Vector3();
    return ctx.raycaster.ray.intersectPlane(ctx.dragPlane, p) ? p : null;
  }

  function freeCubes() { return run.cubes.filter((c) => !c.locked).map((c) => c.mesh); }

  function bindPointer(canvas) {
    canvas.addEventListener("pointerdown", (e) => {
      if (!run) return;
      const hit = pick(e, freeCubes());
      if (hit) {
        const cube = hit.object.userData.cube;
        canvas.setPointerCapture(e.pointerId);
        run.drag = { cube, x: e.clientX, y: e.clientY, moved: false, id: e.pointerId };
        return;
      }
      const padHit = pick(e, run.pads.flatMap((p) => [p.base, p.top]));
      if (padHit) tapPad(padHit.object.userData.pad);
      else select(null);
    });
    canvas.addEventListener("pointermove", (e) => {
      const d = run && run.drag;
      if (!d || d.id !== e.pointerId) {
        if (run && !run.drag && e.pointerType === "mouse") canvas.style.cursor = pick(e, freeCubes()) ? "grab" : "default";
        return;
      }
      if (!d.moved && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 8) return;
      if (!d.moved) { d.moved = true; select(d.cube); canvas.style.cursor = "grabbing"; }
      const p = planePoint(e);
      if (!p) return;
      d.cube.mesh.position.set(THREE.MathUtils.clamp(p.x, -5, 5), CUBE_Y + 0.6, THREE.MathUtils.clamp(p.z, -3, 3));
      d.cube.shadow.position.set(d.cube.mesh.position.x, 0.01, d.cube.mesh.position.z);
      highlightPad(nearestPad(d.cube.mesh.position));
    });
    const end = (e) => {
      const d = run && run.drag;
      if (!d || d.id !== e.pointerId) return;
      run.drag = null;
      canvas.style.cursor = "default";
      highlightPad(null);
      if (!d.moved) { select(run.selected === d.cube ? null : d.cube); return; }
      const pad = nearestPad(d.cube.mesh.position);
      if (pad) attempt(d.cube, pad);
      else { sendHome(d.cube); select(null); }
    };
    canvas.addEventListener("pointerup", end);
    canvas.addEventListener("pointercancel", end);
  }

  function nearestPad(pos) {
    let best = null, bd = 1.45;
    for (const p of run.pads) {
      if (p.done) continue;
      const dd = Math.hypot(pos.x - p.group.position.x, pos.z - p.group.position.z);
      if (dd < bd) { bd = dd; best = p; }
    }
    return best;
  }

  function highlightPad(pad) {
    run.pads.forEach((p) => { p.ring.material.opacity = p === pad ? 0.9 : 0; });
    run.ui.markTarget(pad ? pad.index : -1);
  }

  function select(cube) {
    run.cubes.forEach((c) => {
      c.mesh.material.emissive = c === cube ? BRASS : new THREE.Color(0x000000);
      c.mesh.material.emissiveIntensity = c === cube ? 0.35 : 0;
    });
    run.selected = cube;
    run.ui.hint(cube ? `اختر منصة تعريف «${cube.term.en}»` : null);
  }

  function tapPad(pad) {
    if (!run || pad.done) return;
    if (!run.selected) { run.ui.toast("اختر مكعباً أولاً", ""); return; }
    attempt(run.selected, pad);
  }

  function attempt(cube, pad) {
    select(null);
    if (cube.term.id === pad.term.id) {
      cube.locked = true;
      pad.done = true;
      run.matched++;
      run.score += 10;
      const to = pad.group.position;
      tween(cube.mesh.position, { x: to.x, y: 0.225 + cube.mesh.geometry.parameters.height * 0.41, z: to.z }, 0.35);
      tween(cube.mesh.rotation, { y: 0 }, 0.35);
      tween(cube.shadow.position, { x: to.x, z: to.z }, 0.35);
      tween(cube.mesh.scale, { x: 0.82, y: 0.82, z: 0.82 }, 0.35);
      run.ui.markDone(pad.index, cube.term);
      run.ui.toast(`${cube.term.en} = ${cube.term.ar}`, "ok");
      run.ui.setScore(run.score);
      if (run.matched === run.items.length) setTimeout(finishLevel, 700);
    } else {
      run.mistakes++;
      sendHome(cube);
      run.ui.shake(pad.index);
      run.ui.toast("ليس هذا تعريفه، حاول مرة أخرى", "bad");
    }
  }

  function sendHome(cube) {
    tween(cube.mesh.position, { x: cube.home.x, y: CUBE_Y, z: cube.home.z }, 0.35);
    tween(cube.shadow.position, { x: cube.home.x, z: cube.home.z }, 0.35);
  }

  function finishLevel() {
    const stars = run.mistakes === 0 ? 3 : run.mistakes <= 2 ? 2 : 1;
    run.score += stars * 5;
    run.ui.setScore(run.score);
    if (run.decoy) run.ui.markDecoy(run.pads.find((p) => p.term === run.decoy).index, run.decoy);
    run.ui.levelDone({
      stars,
      score: run.score,
      mistakes: run.mistakes,
      items: run.items,
      levelIndex: run.levelIndex,
      levelCount: run.levels.length,
    });
  }

  // ---------- loop ----------
  function tween(obj, to, dur) {
    const from = {};
    for (const k in to) from[k] = obj[k];
    ctx.tweens = ctx.tweens.filter((t) => t.obj !== obj);
    ctx.tweens.push({ obj, from, to, dur, t: 0 });
  }

  function frame() {
    ctx.raf = requestAnimationFrame(frame);
    const dt = Math.min(ctx.clock.getDelta(), 0.05);
    const time = ctx.clock.elapsedTime;
    ctx.tweens = ctx.tweens.filter((tw) => {
      tw.t = Math.min(tw.t + dt / tw.dur, 1);
      const e = 1 - Math.pow(1 - tw.t, 3);
      for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
      return tw.t < 1;
    });
    if (run) {
      const busy = new Set(ctx.tweens.map((t) => t.obj));
      for (const c of run.cubes) {
        if (c.locked || (run.drag && run.drag.cube === c) || busy.has(c.mesh.position)) continue;
        const lift = run.selected === c ? 0.35 : 0;
        c.mesh.position.y = CUBE_Y + lift + Math.sin(time * 1.6 + c.phase) * 0.06;
        c.mesh.rotation.y += dt * (run.selected === c ? 0.9 : 0.12);
      }
    }
    ctx.renderer.render(ctx.scene, ctx.camera);
  }

  return {
    id: "term-lab",
    levelsOf,
    start(unit, levelIndex, ui, onExit) {
      const canvas = document.getElementById("scene");
      if (!ctx) build(canvas);
      startLevel(unit, levelIndex, ui, onExit);
      cancelAnimationFrame(ctx.raf);
      ctx.clock.getDelta();
      frame();
    },
    stop() {
      if (ctx) cancelAnimationFrame(ctx.raf);
      run = null;
    },
    resize,
    // screen positions of the free cubes and open pads, for the automated browser test
    peek() {
      if (!run) return null;
      const at = (o) => {
        const v = o.getWorldPosition(new THREE.Vector3()).project(ctx.camera);
        return { x: (v.x + 1) / 2 * window.innerWidth, y: (1 - v.y) / 2 * window.innerHeight };
      };
      return {
        cubes: run.cubes.filter((c) => !c.locked).map((c) => ({ id: c.term.id, ...at(c.mesh) })),
        pads: run.pads.filter((p) => !p.done).map((p) => ({ id: p.term.id, index: p.index, ...at(p.group) })),
      };
    },
  };
})();

// Platform shell: home page (one card per unit in content/terms), game registry, progress in localStorage.
const UNITS = JSON.parse(document.getElementById("units-data").textContent);

// Every unit gets every game; a game with ready:false shows as "قريباً".
const GAMES = [
  { id: "term-lab", name: "مختبر المصطلحات", desc: "اسحب مكعب المصطلح الإنكليزي إلى منصة تعريفه العربي.", ready: true, impl: TermLab },
  { id: "atom-race", name: "سباق الذرات", desc: "سؤال سريع وثلاثة أبواب، اعبر من باب الجواب الصحيح.", ready: false },
  { id: "term-bank", name: "بنك المصطلحات", desc: "بطاقات تدور للحفظ: وجه إنكليزي، ووجه عربي مع التعريف.", ready: false },
];

const num = (n) => Number(n).toLocaleString("ar-IQ");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- progress (per-viewer convenience only) ----------
const STORE_KEY = "askdo.platform.v1";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (_) { progress = {}; }
function saveProgress() { try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (_) {} }
function gameProgress(unitId, gameId) {
  progress[unitId] = progress[unitId] || {};
  return (progress[unitId][gameId] = progress[unitId][gameId] || { stars: {}, best: {} });
}

function starsHtml(got, total) {
  let s = "";
  for (let i = 0; i < total; i++) s += i < got ? "★" : '<span class="off">★</span>';
  return s;
}

// ---------- home ----------
function renderHome() {
  let termCount = 0, starsGot = 0, starsMax = 0;
  const cards = UNITS.map((u) => {
    termCount += u.terms.length;
    const games = GAMES.map((g) => {
      if (!g.ready) {
        return `<button class="game-card" type="button" disabled>
          <strong>${g.name}</strong><p>${g.desc}</p>
          <div class="meta"><span class="soon">قريباً</span></div></button>`;
      }
      const levels = g.impl.levelsOf(u.terms).length;
      const gp = gameProgress(u.id, g.id);
      const got = Object.values(gp.stars).reduce((a, b) => a + b, 0);
      starsGot += got; starsMax += levels * 3;
      return `<button class="game-card" type="button" data-unit="${esc(u.id)}" data-game="${g.id}">
        <strong>${g.name}</strong><p>${g.desc}</p>
        <div class="meta"><span>${num(levels)} مستويات</span><span class="stars" aria-label="${num(got)} من ${num(levels * 3)} نجوم">${starsHtml(Math.round((got / (levels * 3)) * 5), 5)}</span></div>
      </button>`;
    }).join("");
    return `<article class="unit">
      <div class="unit-head">
        <div><div class="unit-num">${u.unit >= 90 ? "مصطلحات إضافية" : `الفصل ${num(u.unit)}`}</div><h2>${esc(u.title_ar)}</h2><div class="unit-en">${esc(u.title_en)}</div></div>
        <span class="status ${u.status === "reviewed" ? "reviewed" : ""}">${u.status === "reviewed" ? "مطابق للكتاب" : "مسودة"}</span>
      </div>
      <div class="term-strip" aria-label="مصطلحات الفصل">${u.terms.map((t) => `<span>${esc(t.en)}</span>`).join("")}</div>
      <div class="games">${games}</div>
    </article>`;
  });
  cards.push(`<article class="unit placeholder"><h2>الفصول القادمة</h2>
    <p>كل فصل يضاف إلى ملف المصطلحات يظهر هنا تلقائياً مع ألعابه.</p></article>`);
  $("units").innerHTML = cards.join("");
  $("totals").innerHTML = `
    <span class="chip"><b>${num(UNITS.length)}</b> فصل</span>
    <span class="chip"><b>${num(termCount)}</b> مصطلح</span>
    <span class="chip"><b>${num(starsGot)}</b> / ${num(starsMax)} نجمة</span>`;
}

$("units").addEventListener("click", (e) => {
  const card = e.target.closest("[data-game]");
  if (!card) return;
  const unit = UNITS.find((u) => u.id === card.dataset.unit);
  const game = GAMES.find((g) => g.id === card.dataset.game);
  const gp = gameProgress(unit.id, game.id);
  const levels = game.impl.levelsOf(unit.terms).length;
  let next = 0;
  while (next < levels - 1 && gp.stars[next]) next++;
  openGame(unit, game, next);
});

// ---------- game screen ----------
let current = null;
let toastTimer = 0;

const ui = {
  renderTray(items, letters, colors, onTap) {
    const old = document.querySelector(".tray");
    if (old) old.remove();
    const tray = document.createElement("div");
    tray.className = "tray";
    tray.innerHTML = items.map((t, i) => `<button class="def" type="button" data-i="${i}" style="--c:${colors[i]}">
      <span class="tag">${letters[i]}</span><span class="txt">${esc(t.def_ar)}<span class="ans" hidden></span></span></button>`).join("");
    tray.addEventListener("click", (e) => {
      const b = e.target.closest(".def");
      if (b && !b.classList.contains("done")) onTap(Number(b.dataset.i));
    });
    $("stage-ui").replaceChildren(tray, Object.assign(document.createElement("p"), { className: "hint", id: "hint" }));
    ui.hint(null);
  },
  markDone(i, term) {
    const b = document.querySelector(`.def[data-i="${i}"]`);
    b.classList.add("done");
    const a = b.querySelector(".ans");
    a.hidden = false;
    a.textContent = `${term.emoji || "✔"} ${term.ar} · ${term.en}`;
  },
  markDecoy(i, term) {
    const b = document.querySelector(`.def[data-i="${i}"]`);
    b.classList.add("decoy");
    const a = b.querySelector(".ans");
    a.hidden = false;
    a.textContent = `تعريف إضافي: ${term.ar} · ${term.en}`;
  },
  pool: () => UNITS.flatMap((u) => u.terms),
  markTarget(i) {
    document.querySelectorAll(".def").forEach((b) => b.classList.toggle("target", Number(b.dataset.i) === i));
  },
  shake(i) {
    const b = document.querySelector(`.def[data-i="${i}"]`);
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
  },
  hint(text) {
    const h = $("hint");
    if (h) h.textContent = text || "اسحب المكعب إلى منصة تعريفه، أو المسه ثم المس التعريف";
  },
  toast(text, kind) {
    const t = $("toast");
    t.textContent = text;
    t.className = "toast show " + (kind || "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.className = "toast"), 1600);
  },
  setScore(s) { $("hud-score").textContent = num(s); },
  setLevel(i, n) { $("hud-level").textContent = `${current.unit.title_ar} · المستوى ${num(i + 1)} من ${num(n)}`; },
  levelDone(r) {
    const gp = gameProgress(current.unit.id, current.game.id);
    gp.stars[r.levelIndex] = Math.max(gp.stars[r.levelIndex] || 0, r.stars);
    gp.best[r.levelIndex] = Math.max(gp.best[r.levelIndex] || 0, r.score);
    saveProgress();
    const last = r.levelIndex === r.levelCount - 1;
    const wrap = document.createElement("div");
    wrap.className = "sheet-wrap";
    wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <h3 id="sheet-title">${last ? "أنهيت الفصل!" : `أنهيت المستوى ${num(r.levelIndex + 1)}`}</h3>
      <div class="big-stars" aria-label="${num(r.stars)} من ٣ نجوم">${starsHtml(r.stars, 3)}</div>
      <p>${num(r.score)} نقطة · ${r.mistakes ? `${num(r.mistakes)} محاولة خاطئة` : "بلا أخطاء"}</p>
      <div class="learned">${r.items.map((t) => `<div><span>${esc(t.emoji || "")} ${esc(t.ar)}</span><bdi>${esc(t.en)}</bdi>${t.example_ar ? `<small>${esc(t.example_ar)}</small>` : ""}</div>`).join("")}</div>
      <div class="actions">
        ${last ? "" : `<button class="btn primary" type="button" data-act="next">المستوى التالي</button>`}
        <button class="btn" type="button" data-act="again">أعد المستوى</button>
        <button class="btn" type="button" data-act="home">الفصول</button>
      </div></div>`;
    wrap.addEventListener("click", (e) => {
      const act = e.target.closest("[data-act]")?.dataset.act;
      if (!act) return;
      wrap.remove();
      if (act === "home") closeGame();
      else openGame(current.unit, current.game, r.levelIndex + (act === "next" ? 1 : 0));
    });
    $("stage-ui").appendChild(wrap);
    wrap.querySelector(".btn").focus();
  },
};

function openGame(unit, game, levelIndex) {
  current = { unit, game };
  $("home").hidden = true;
  $("game").hidden = false;
  $("hud-game").textContent = game.name;
  game.impl.start(unit, levelIndex, ui, closeGame);
}

function closeGame() {
  if (current) current.game.impl.stop();
  current = null;
  $("game").hidden = true;
  $("home").hidden = false;
  renderHome();
}

$("btn-back").addEventListener("click", closeGame);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && current) closeGame(); });

renderHome();

</script>

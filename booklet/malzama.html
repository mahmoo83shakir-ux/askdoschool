}

<section data-kind="page" data-chapter="1" data-numbered="1" data-foot="الفصل الأول" data-foot-name="خواص المادة">
<div class="chap"><div class="chap-b"><div><small>الفصل الأول · Chapter 1</small><strong>خواص المادة</strong></div></div></div>
<p class="lead">للمادة صفات يمكن تحديدها أو قياسها. في هذا الفصل 15 مصطلحاً موزعة على ثلاثة دروس.</p>
<h2 class="sec"><span class="sec-n">1-1</span>حالات المادة وخواصها</h2>
<table class="tbl">
<thead><tr><th class="n">ت</th><th>المصطلح</th><th>Term</th><th>التعريف</th></tr></thead>
<tbody>
<tr><td class="n">1</td><td class="ar tm">المادة</td><td class="en tm">Matter</td><td class="d blue">كل شيء له كتلة وله حجم.</td></tr>
<tr><td class="n">2</td><td class="ar tm">الخاصية الفيزيائية</td><td class="en tm">Physical Property</td><td class="d blue">خاصية للمادة يمكن ملاحظتها أو قياسها من دون تغيير في هوية المادة.</td></tr>
<tr><td class="n">3</td><td class="ar tm">التغير الفيزيائي</td><td class="en tm">Physical Change</td><td class="d blue">تغير تتغير فيه بعض صفات المادة الفيزيائية دون تغير المادة الأصلية.</td></tr>
<tr><td class="n">4</td><td class="ar tm">التغير الكيميائي</td><td class="en tm">Chemical Change</td><td class="d blue">تغير في تركيب المادة تنتج عنه مادة جديدة تختلف في خواصها.</td></tr>
<tr><td class="n">5</td><td class="ar tm">الخاصية الكيميائية</td><td class="en tm">Chemical Property</td><td class="d blue">قابلية المادة للتفاعل مع مواد أخرى وتكوين مادة جديدة.</td></tr>
<tr><td class="n">6</td><td class="ar tm">الشد السطحي</td><td class="en tm">Surface Tension</td><td class="d blue">قوة تؤثر في جزيئات سطح السائل فيتصرف السطح كأنه غشاء رقيق ومرن.</td></tr>
<tr><td class="n">7</td><td class="ar tm">اللزوجة</td><td class="en tm">Viscosity</td><td class="d blue">خاصية السائل التي تجعله يقاوم الانسياب.</td></tr>

<p class="cap">جدول (1-1) مصطلحات الدرس الأول (1)</p>
<div class="note"><span class="note-k"><svg><use href="#i-bulb"/></svg>ملاحظة</span><p>في الشمعة المشتعلة تغيّران معاً: <b class="red">انصهار الشمع</b> تغير فيزيائي لأن الشمع يبقى شمعاً، أما <b class="red">احتراق الفتيل</b> فتغير كيميائي لأنه ينتج مواد جديدة.</p></div>
</section>

  function hideFloating() { tools.hidden = true; menu.hidden = true; if (!eqPop.hidden) closeEq(); setActive(null); }

  function blockOf(el) {

  function neighborContent(c, dir) {

  function blockAction(act) {

    if (act === 'eq') { insertEq(); return; }

    if (/^p-/.test(act) && !curPic) return;

    if (act === 'r-add') {

  function doInsert(html, target) {

  function loadImage(file, cb) {

    reader.onload = function () {

  /* ---------- equations ---------- */

    if (!mjReady) { eqPrev.textContent = tex; return; }

  }

  /* ---------- page actions ---------- */
  function confirmTwice(btn, label) {

    var old = btn.textContent;
    btn.setAttribute('data-armed', '1'); btn.textContent = label;
    setTimeout(function () { if (document.body.contains(btn)) { btn.removeAttribute('data-armed'); btn.textContent = old; } }, 3500);
    return false;
  }

  function pageAction(act, i, btn) {
    var P = S.pages, p = P[i];
    if (act === 'add') { insTarget = { page: i }; placeNear(menu, btn.getBoundingClientRect()); return; }
    if (act === 'del' && !confirmTwice(btn, 'تأكيد حذف الورقة')) return;
    syncFromDom();
    if (act === 'overflow') { moveOverflow(i); return; }
    pushUndo();
    if (act === 'up' && i > 1) { P.splice(i - 1, 0, P.splice(i, 1)[0]); }
    else if (act === 'down' && i < P.length - 1) { P.splice(i + 1, 0, P.splice(i, 1)[0]); }
    else if (act === 'dup') { P.splice(i + 1, 0, JSON.parse(JSON.stringify(p))); }
    else if (act === 'new') { P.splice(i + 1, 0, { kind: 'page', chapter: p.chapter, numbered: true, foot: p.foot, footName: p.footName, html: '<p>اكتب هنا…</p>' }); }
    else if (act === 'del') { P.splice(i, 1); }
    renderAll(); afterChange();
    if (act === 'new' || act === 'dup') { var sh = $('.sheet[data-idx="' + (i + 1) + '"]', book); if (sh) sh.scrollIntoView({ block: 'start' }); }
  }

    pushUndo();
    var moved = [];
    while (c.scrollHeight > c.clientHeight + 2 && c.children.length > 1) { moved.unshift(c.lastElementChild); c.lastElementChild.remove(); }
    if (!moved.length) { undoStack.pop(); status('العنصر الأخير وحده أطول من الصفحة؛ قسّمه أو صغّره.'); return; }
    var wrap = document.createElement('div'); moved.forEach(function (m) { wrap.appendChild(m); });
    syncFromDom();
    var p = S.pages[i];
    S.pages.splice(i + 1, 0, { kind: 'page', chapter: p.chapter, numbered: true, foot: p.foot, footName: p.footName, html: cleanHTML(wrap) });
    renderAll(); afterChange();
  }

  /* ---------- save / export ---------- */
  function resetCSS() {
    var s = $$('style', document.head).filter(function (st) { return !st.id; })[0];
    var t = s && s.textContent;
    return t && /margin/.test(t) ? t : ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}';
  }
  function pagesTemplate() {
    return S.pages.map(function (p) {
      if (p.kind === 'cover') return '<section data-kind="cover"></section>';
      return '<section data-kind="page" data-chapter="' + (p.chapter || '') + '" data-numbered="' + (p.numbered ? 1 : 0) + '" data-foot="' + esc(p.foot) + '" data-foot-name="' + esc(p.footName) + '">\n' + p.html + '\n</section>';
    }).join('\n');
  }
  function buildDoc() {
    var keep = $$('[data-keep]').filter(function (e) { return e.id !== 'app-script'; }).map(function (e) { return e.outerHTML; }).join('\n');
    var body = '<title>' + esc(docTitle()) + '</title>\n' + keep +
      '\n<div class="app" id="app" dir="rtl" lang="ar"></div>\n' +
      '<script type="application/json" id="malzama-settings">' + JSON.stringify(S.settings).replace(/</g, '\\u003c') + '<\/script>\n' +
      '<template id="malzama-pages">\n' + pagesTemplate() + '\n</template>\n' +
      document.getElementById('app-script').outerHTML;
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + resetCSS() + '</style></head><body>' + body + '</body></html>';
  }

  function setBusy(b) { busy = b; $('#btn-save').disabled = b; }

  function save(retried) {
    afterChange();
    if (JSON.stringify(S) === savedJSON && !retried) { status('لا توجد تعديلات لحفظها'); return; }
    var html = buildDoc();
    if (standalone) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      a.download = docTitle() + '.html';
      document.body.appendChild(a); a.click(); a.remove();
      status('حُفظت نسخة على جهازك');
      return;
    }
    if (!artifactApi) { status('الحفظ غير متاح في هذه النافذة.'); return; }
    if (html.length > 15.5e6) { status('حجم الملزمة أكبر من المسموح بسبب الصور. صغّر الصور أو احذف بعضها ثم احفظ.'); return; }
    setBusy(true); status('جارٍ الحفظ…');
    artifactApi.publish(html).then(function () {
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      savedJSON = JSON.stringify(S);
      status('تم الحفظ');
    }, function (err) {
      var code = err && err.code;
      setBusy(false);
      if (code === 'conflict') status('نُشرت نسخة أحدث قبل قليل، وستُعاد تحميل الصفحة. تعديلاتك محفوظة كمسودة ويمكنك استعادتها.');
      else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') { status('لا تملك صلاحية حفظ هذه الملزمة؛ هذه النسخة للقراءة فقط.'); $('#btn-save').hidden = true; }
      else if (code === 'too_large') status('حجم الملزمة أكبر من المسموح. صغّر الصور أو احذف بعضها ثم احفظ.');
      else if (code === 'rate_limited') status('حفظتَ عدة مرات بسرعة. انتظر دقيقة ثم احفظ مرة أخرى.');
      else if (code === 'invalid_content' || code === 'transform_error') status('تعذّر الحفظ بسبب خطأ في محتوى الصفحة.');
      else if (!retried) { status('جارٍ إعادة المحاولة…'); setTimeout(function () { save(true); }, 1500 + Math.random() * 1500); }
      else status('تعذّر الحفظ بسبب مشكلة مؤقتة في الخدمة. حاول مرة أخرى بعد قليل.');
    });
  }

  function download() {
    if (!downloadsApi) return;
    afterChange();
    downloadsApi.save({ filename: docTitle() + '.html', data: buildDoc() }).then(function () {
      status('نُزّل الملف. افتحه في المتصفح واضغط Ctrl+P ثم اختر "حفظ كـ PDF".');
    }, function (err) {
      var code = err && err.code;

      else { status('التنزيل غير متاح هنا.'); $('#btn-dl').hidden = true; }
    });
  }

  /* ---------- events ---------- */
  $('#btn-edit').addEventListener('click', enterEdit);

  $('#btn-save').addEventListener('click', function () { save(false); });
  $('#btn-undo').addEventListener('click', doUndo);
  $('#btn-dl').addEventListener('click', download);
  $('#btn-print').addEventListener('click', function () { window.print(); });
  $$('.sw button').forEach(function (b) {
    b.addEventListener('click', function () {
      syncFromDom(); pushUndo();
      S.settings.palette = b.getAttribute('data-pal');
      book.setAttribute('data-palette', S.settings.palette);
      $$('.sw button').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      afterChange();
    });
  });
  $('#btn-restore').addEventListener('click', function () {
    var d = null; try { d = localStorage.getItem(DRAFT_KEY); } catch (e) {}
    $('#draft-banner').hidden = true;
    if (!d) return;
    try { S = JSON.parse(d); } catch (e) { return; }
    editing = true; app.classList.add('editing'); renderAll();
  });
  $('#btn-discard').addEventListener('click', function () {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    $('#draft-banner').hidden = true;
  });

  book.addEventListener('input', function (e) {
    if (!editing) return;
    var b = e.target.closest && e.target.closest('[data-bind]');
    if (!b) {
      var sel = window.getSelection(), n = sel && sel.anchorNode, el = n && (n.nodeType === 1 ? n : n.parentElement);
      b = el && el.closest('[data-bind]');
    }
    if (b && !b.closest('.wm')) {
      var key = b.getAttribute('data-bind');
      S.settings[key] = b.textContent;
      $$('[data-bind="' + key + '"]', book).forEach(function (o) { if (o !== b) o.textContent = b.textContent; });
      if (key === 'title' || key === 'titleSub') { document.title = docTitle(); $('#bar-name').textContent = docTitle(); }
    }
    changed();
  });

  book.addEventListener('keydown', function (e) {
    if (!editing) return;
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-bind], [data-f]')) { e.preventDefault(); e.target.blur(); }
  });

  book.addEventListener('paste', function (e) {
    if (!editing || !(e.target.closest && e.target.closest('[contenteditable="true"]'))) return;
    var t = (e.clipboardData || window.clipboardData).getData('text/plain');
    e.preventDefault();
    document.execCommand('insertText', false, t);
  });

  book.addEventListener('click', function (e) {
    if (!editing) return;
    var m = e.target.closest('.m');
    if (m && book.contains(m)) { e.preventDefault(); setActive(blockOf(m), m); openEq(m, false); return; }
    var btn = e.target.closest('.pbar [data-act]');
    if (btn && btn.tagName === 'BUTTON') pageAction(btn.getAttribute('data-act'), Number(btn.closest('.pbar').getAttribute('data-for')), btn);
  });

  book.addEventListener('change', function (e) {
    var s = e.target.closest && e.target.closest('select[data-act="chapter"]');
    if (!s || !editing) return;
    syncFromDom(); pushUndo();
    S.pages[Number(s.closest('.pbar').getAttribute('data-for'))].chapter = Number(s.value) || 0;
    renderAll(); afterChange();
  });

  document.addEventListener('selectionchange', function () {
    if (!editing) return;
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var n = sel.anchorNode, el = n && (n.nodeType === 1 ? n : n.parentElement);
    if (!el || !book.contains(el)) return;
    var content = el.closest('.content');
    if (!content) { setActive(null); return; }
    lastRange = sel.getRangeAt(0).cloneRange();
    var blk = el === content ? (content.children[Math.min(sel.anchorOffset, content.children.length - 1)] || null) : blockOf(el);
    setActive(blk, el);
  });

  [tools, menu, eqPop].forEach(function (p) {
    p.addEventListener('mousedown', function (e) { if (e.target.closest('button')) e.preventDefault(); });
  });
  tools.addEventListener('click', function (e) { var b = e.target.closest('[data-b]'); if (b) blockAction(b.getAttribute('data-b')); });
  menu.addEventListener('click', function (e) { var b = e.target.closest('[data-ins]'); if (b) insertBlock(b.getAttribute('data-ins')); });
  imgIn.addEventListener('change', function () {
    var f = imgIn.files && imgIn.files[0];
    if (!f) return;
    var target = insTarget;
    loadImage(f, function (url) { doInsert('<figure class="pic pic-md"><img src="' + url + '" alt=""><figcaption>اكتب وصف الصورة</figcaption></figure>', target); });
  });

  eqIn.addEventListener('input', previewEq);
  eqIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); applyEq(); } });
  $('.eq-keys', eqPop).addEventListener('click', function (e) {
    var b = e.target.closest('[data-k]'); if (!b) return;
    var k = EQ_KEYS[Number(b.getAttribute('data-k'))], s = eqIn.selectionStart, en = eqIn.selectionEnd;
    eqIn.setRangeText(k[1], s, en, 'end'); eqIn.setSelectionRange(s + k[2], s + k[2]); eqIn.focus(); previewEq();
  });
  $('#eq-ok').addEventListener('click', applyEq);
  $('#eq-close').addEventListener('click', closeEq);
  $('#eq-del').addEventListener('click', function () { if (eqTarget) { if (!eqIsNew) { syncFromDom(); pushUndo(); } eqTarget.remove(); eqTarget = null; eqPop.hidden = true; afterChange(); } });

  document.addEventListener('mousedown', function (e) {
    if (!editing) return;
    if (e.target.closest('.tb')) return;
    if (!menu.hidden && !e.target.closest('[data-act="add"]')) menu.hidden = true;
    if (!eqPop.hidden && !e.target.closest('.m')) closeEq();
    if (!e.target.closest('.content')) setActive(null);
  });
  document.addEventListener('keydown', function (e) {
    if (!editing) return;
    if (e.key === 'Escape') { if (!eqPop.hidden) closeEq(); menu.hidden = true; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); save(false); }
  });
  window.addEventListener('scroll', function () { if (editing && activeBlock) positionTools(); menu.hidden = true; }, { passive: true });

  document.addEventListener('mathjax-ready', function () { mjReady = true; renderMath(book); checkOverflow(); });

  /* ---------- fit to width ---------- */
  function fit() {
    var w = Math.max(240, document.documentElement.clientWidth - 32);
    document.documentElement.style.setProperty('--z', Math.min(1, w / A4).toFixed(4));
    if (editing && activeBlock) positionTools();
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);

  /* ---------- capabilities ---------- */
  function offerDraft() {
    var d = null; try { d = localStorage.getItem(DRAFT_KEY); } catch (e) {}
    if (d && d !== savedJSON) $('#draft-banner').hidden = false;
    else if (d) { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
  }
  function initCaps() {
    if (!window.claude || typeof window.claude.use !== 'function') {
      standalone = true;
      $('#btn-edit').hidden = false;
      $('#btn-print').hidden = false;
      $('#btn-save').textContent = 'حفظ نسخة على جهازك';
      offerDraft();
      return;
    }
    Promise.all([window.claude.use('artifact'), window.claude.use('user'), window.claude.use('downloads')]).then(function (r) {
      artifactApi = r[0]; downloadsApi = r[2];
      if (downloadsApi) $('#btn-dl').hidden = false;
      var user = r[1];
      return (user ? user.canEdit() : Promise.resolve(null)).then(function (ok) {
        if (artifactApi && ok !== false) { $('#btn-edit').hidden = false; offerDraft(); }
      });
    }).catch(function () {});
  }

  window.__malzama = { state: function () { syncFromDom(); return JSON.parse(JSON.stringify(S)); }, build: buildDoc };

  renderAll();
  initCaps();
})();
</script>

</body></html>

name: الحلقة اليومية

on:
  schedule:
    - cron: "7 15 * * *"   # 18:07 بتوقيت بغداد، لتكون الحلقة منشورة قبل السابعة مساءً
  workflow_dispatch:
    inputs:
      date:
        description: "تاريخ الحلقة YYYY-MM-DD (اتركه فارغاً لليوم)"
        required: false
        default: ""
      dry_run:
        description: "إنتاج الفيديو فقط من دون نشر"
        type: boolean
        default: false

concurrency:
  group: daily-episode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji
          pip install -r pipeline/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Render and publish
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          YOUTUBE_MADE_FOR_KIDS: ${{ vars.YOUTUBE_MADE_FOR_KIDS }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          PAUSE_PUBLISHING: ${{ vars.PAUSE_PUBLISHING }}
        run: |
          python pipeline/run_daily.py --date "${{ inputs.date }}" ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Keep the video as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode
          path: |
            out/*/episode-*.mp4
            out/*/episode.json
            out/*/slide-00.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Record what was published
        if: always()
        run: |
          git config user.name "episode-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/published.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Record published episode"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
